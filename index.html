    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#2c3e50">

        <!--APPLE-->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <meta name="description" content="Aplicativo PWA para gerenciamento de patrimônio">
        <title>Document</title>
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1>Controle de Patrimônio
                <button id="installBtn" class="btn install-btn" hidden>Instalar</button>
                </h1>
            </header>

            <section id="botaoNovoPatrimonioSection" class="section">
                <button class="btn btn-large btn-sucess" onclick="toggleFormSection">
                    Novo Patrimônio
                </button>
            </section>
            <section id="formSection" class="section">
                <h2>Novo Patrimônio</h2>
                <form id="patrimonioForm">
                    <div class="form-group">
                        <label>Número do Patrimônio</label>
                        <input type="text" id="numeroPatrimonio" placeholder="Descreva o Número"
                        required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="descricao" placeholder="Descreva o Patrimônio"
                        required autocomplete="off">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="toggleFormSection()">
                            Cancelar
                        </button>
                    </div>
                </form>
            </section>
            <section id="tabelaSection" class="section">
                <h2>Lista de Patrimônios</h2>
                <div id="patrimonioList" class="patrimonio-list">
                    <p class="empty-message">Nenhum patrimônio registrado</p>
                </div>
            </section>
        </div>

        <footer class="footer">
            <p>Controle de Patrimônio</p>
        </footer>
        
    </body>
    </html>
